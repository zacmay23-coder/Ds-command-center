services:
  command-center:
    build:
      context: ..
      dockerfile: ds-jaja/Dockerfile
    container_name: ds-command-center
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8082
      NODE_ENV: production
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/ds-jaja/data
      - ./.secrets:/run/secrets:ro
