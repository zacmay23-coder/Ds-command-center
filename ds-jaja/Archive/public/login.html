<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Desert Storm Command Center</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <p class="eyebrow">Officer Access</p>
      <h1>Sign in</h1>
      <p class="muted">Use the Firebase officer account for the Command Center.</p>

      <form id="loginForm" class="auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">Sign In</button>
      </form>

      <p id="authMessage" class="auth-message"></p>
      <p class="auth-link">Need access? <a href="/register.html">Register an account</a>.</p>
    </main>

    <script type="module" src="/login.js"></script>
  </body>
</html>
