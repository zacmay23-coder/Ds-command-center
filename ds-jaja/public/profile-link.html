<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ewar Command">
    <title>Link Roster Profile - Desert Storm Command Center</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <p class="eyebrow">Player Identity</p>
      <h2>Select your roster profile</h2>
      <p class="muted">Choose your in-game name. An administrator will review this selection before linking your account.</p>

      <form id="profileLinkForm" class="auth-form">
        <label>
          In-game roster name
          <select id="playerId" name="playerId" required>
            <option value="">Loading roster…</option>
          </select>
        </label>
        <button class="primary-button" type="submit">Link My Profile</button>
      </form>

      <p class="muted">Choose carefully. An administrator must correct the link after it is saved.</p>
      <p id="linkMessage" class="auth-message"></p>
      <button id="signOutButton" class="secondary-button" type="button">Sign Out</button>
    </main>

    <script type="module" src="/pwa.js"></script>
    <script type="module" src="/profile-link.js"></script>
  </body>
</html>
