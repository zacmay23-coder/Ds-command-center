<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ewar Command">
    <title>Sign In - Ewar Command Center</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <header class="auth-brand">
        <span class="auth-crest" aria-hidden="true">EW</span>
        <p>Ewar</p>
        <h1>Lords of War</h1>
        <small><i></i>Alliance Operations<i></i></small>
      </header>
      <section class="auth-card">
        <p class="eyebrow">Member / Officer Access</p>
        <h2>Sign in</h2>
        <p class="muted">Enter your credentials to access the Alliance Operations center.</p>

        <form id="loginForm" class="auth-form">
          <label>Email address<input name="email" type="email" autocomplete="email" placeholder="Enter your email" required></label>
          <label>Password<div class="auth-password-field"><input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" data-toggle-password aria-label="Show password">Show</button></div></label>
          <button class="primary-button auth-submit" type="submit">Sign In <span aria-hidden="true">→</span></button>
        </form>

        <div class="auth-guest-divider"><span>or explore safely</span></div>
        <button id="guestPreviewButton" class="secondary-button auth-guest-button" type="button">Explore as Guest</button>
        <p class="auth-guest-copy">Preview the Command Center in read-only mode. No account required.</p>

        <p id="authMessage" class="auth-message"></p>
        <p class="auth-link">Need access? <a href="/register.html">Register an account</a></p>
      </section>
    </main>

    <script type="module" src="/pwa.js"></script>
    <script type="module" src="/login.js"></script>
  </body>
</html>
