<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Desert Storm Command Center</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <p class="eyebrow">Officer Access</p>
      <h1>Register</h1>
      <p class="muted">Create a Firebase Email/Password account for this Command Center.</p>

      <form id="registerForm" class="auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="6" required></label>
        <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></label>
        <button class="primary-button" type="submit">Create Account</button>
      </form>

      <p id="authMessage" class="auth-message"></p>
      <p class="auth-link">Already registered? <a href="/login.html">Sign in</a>.</p>
    </main>

    <script type="module" src="/register.js"></script>
  </body>
</html>
